plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'ir.ghadirpartner.nativeapp'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 543030
        versionName '5.4.3.3'
    }

    flavorDimensions 'mode'
    productFlavors {
        portal {
            dimension 'mode'
            applicationId 'ir.ghadirpartner.portalapp'
            resValue 'string', 'app_name', 'قدیر پارتنر'
            buildConfigField 'String', 'APP_MODE', '"portal"'
            buildConfigField 'String', 'API_BASE', '"https://ghadirpartner.ir/partners"'
        }
        automation {
            dimension 'mode'
            applicationId 'ir.ghadirpartner.automationapp'
            resValue 'string', 'app_name', 'قدیر پارتنر اتوماسیون'
            buildConfigField 'String', 'APP_MODE', '"automation"'
            buildConfigField 'String', 'API_BASE', '"https://ghadirpartner.ir"'
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-beta'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.8'
    implementation 'androidx.compose.foundation:foundation:1.7.8'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.8'
}
