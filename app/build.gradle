buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.yaml:snakeyaml:2.3' }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def orderPolicy = new org.yaml.snakeyaml.Yaml().load(rootProject.file('config/order-flow.yaml').text)
def policyKeys = ['version_name', 'version_code', 'maximum_quantity', 'serial_tier_threshold', 'credit_commitment'] as Set
if (!(orderPolicy instanceof Map) || orderPolicy.keySet() != policyKeys ||
    !(orderPolicy.version_name instanceof String) || !(orderPolicy.version_name ==~ /[0-9.]+-r[0-9.]+/) ||
    !(orderPolicy.version_code instanceof Integer) || orderPolicy.version_code <= 543061 ||
    !(orderPolicy.maximum_quantity instanceof Integer) || !(orderPolicy.maximum_quantity in 1..Integer.MAX_VALUE) ||
    !(orderPolicy.serial_tier_threshold instanceof Integer) || !(orderPolicy.serial_tier_threshold in 1..orderPolicy.maximum_quantity) ||
    !(orderPolicy.credit_commitment instanceof String) || orderPolicy.credit_commitment.trim().isEmpty()) {
    throw new GradleException('Invalid config/order-flow.yaml')
}

def visualPolicy = new org.yaml.snakeyaml.Yaml().load(rootProject.file('config/portal-visuals.yaml').text)
if (!(visualPolicy instanceof Map) || visualPolicy.keySet() != (['section_opacity_light', 'section_opacity_dark'] as Set) ||
    !visualPolicy.values().every { it instanceof Number && it > 0 && it <= 1 }) {
    throw new GradleException('Invalid config/portal-visuals.yaml')
}

def popupPolicy = new org.yaml.snakeyaml.Yaml().load(rootProject.file('config/offer-popup.yaml').text)
if (!(popupPolicy instanceof Map) || popupPolicy.keySet() != (['enabled'] as Set) || !(popupPolicy.enabled instanceof Boolean)) throw new GradleException('Invalid config/offer-popup.yaml')

android {
    namespace 'ir.ghadirpartner.nativeapp'
    compileSdk 36

    defaultConfig {
        buildConfigField 'float', 'SECTION_OPACITY_LIGHT', visualPolicy.section_opacity_light.toString() + 'f'
        buildConfigField 'float', 'SECTION_OPACITY_DARK', visualPolicy.section_opacity_dark.toString() + 'f'
        buildConfigField 'boolean', 'OFFER_POPUP_ENABLED', popupPolicy.enabled.toString()
        minSdk 24
        targetSdk 36
        versionCode orderPolicy.version_code
        versionName orderPolicy.version_name
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'int', 'ORDER_MAXIMUM_QUANTITY', orderPolicy.maximum_quantity.toString()
        buildConfigField 'int', 'ORDER_SERIAL_TIER_THRESHOLD', orderPolicy.serial_tier_threshold.toString()
        buildConfigField 'String', 'ORDER_CREDIT_COMMITMENT', groovy.json.JsonOutput.toJson(orderPolicy.credit_commitment)
        buildConfigField 'String', 'ORDER_CREDIT_COMMITMENT_SHA256', groovy.json.JsonOutput.toJson(java.security.MessageDigest.getInstance('SHA-256').digest(orderPolicy.credit_commitment.getBytes('UTF-8')).encodeHex().toString())
    }

    flavorDimensions 'mode'
    productFlavors {
        portal {
            dimension 'mode'
            applicationId 'ir.ghadirpartner.portalapp'
            resValue 'string', 'app_name', 'قدیر پارتنر'
            buildConfigField 'String', 'APP_MODE', '"portal"'
            buildConfigField 'String', 'API_BASE', '"https://ghadirpartner.ir/partners"'
        }
        automation {
            dimension 'mode'
            applicationId 'ir.ghadirpartner.automationapp'
            resValue 'string', 'app_name', 'قدیر پارتنر اتوماسیون'
            buildConfigField 'String', 'APP_MODE', '"automation"'
            buildConfigField 'String', 'API_BASE', '"https://ghadirpartner.ir"'
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-beta'
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.caverock:androidsvg-aar:1.4'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.8'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.8'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.8'
    implementation 'androidx.compose.foundation:foundation:1.7.8'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.8'
}

// Reassemble the unmodified Figma PNG from small, checked-in binary transport parts.
// Both Android flavors consume the identical verified image; no network is used at build time.
def figmaAssetParts = layout.projectDirectory.dir('design-assets/figma_mix_offer')
def figmaGeneratedRes = layout.buildDirectory.dir('generated/figma-assets/res')
android.sourceSets.main.res.srcDir(figmaGeneratedRes)
def prepareFigmaAssetsTask = tasks.register('prepareFigmaAssets') {
    inputs.files(fileTree(figmaAssetParts.asFile) { include 'part-*.bin' })
    outputs.dir(figmaGeneratedRes)
    doLast {
        def parts = figmaAssetParts.asFile.listFiles()?.findAll { it.name ==~ /part-\d{3}\.bin/ }?.sort { it.name }
        if (!parts) throw new GradleException('Figma offer image parts are missing')
        def combined = new ByteArrayOutputStream()
        parts.each { combined.write(it.bytes) }
        def bytes = combined.toByteArray()
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        def expected = 'e77863cba9a10e46566434516a8bc201ea5585509378ae77f87224e21559cfad'
        if (actual != expected) throw new GradleException('Figma offer image checksum mismatch')
        def target = new File(figmaGeneratedRes.get().asFile, 'drawable-nodpi/figma_mix_offer.png')
        target.parentFile.mkdirs()
        target.bytes = bytes
    }
}
tasks.matching { it.name == 'preBuild' || (it.name.startsWith('merge') && it.name.endsWith('Resources')) }.configureEach {
    dependsOn prepareFigmaAssetsTask
}

def brandParts = layout.projectDirectory.dir('design-assets/brand_logo')
def prepareBrandAssetsTask = tasks.register('prepareBrandAssets') {
    inputs.files(fileTree(brandParts.asFile) { include 'part-*.bin' })
    outputs.file(figmaGeneratedRes.map { it.file('drawable-nodpi/brand_logo.png') })
    doLast {
        def parts = brandParts.asFile.listFiles()?.findAll { it.name ==~ /part-\d{3}\.bin/ }?.sort { it.name }
        if (!parts) throw new GradleException('Original brand image parts are missing')
        def combined = new ByteArrayOutputStream()
        parts.each { combined.write(it.bytes) }
        def bytes = combined.toByteArray()
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        if (actual != '198eafd87bfc5650826f98dc9d333f7c28863addaa887fe701618893383f1aa6') throw new GradleException('Original brand image checksum mismatch')
        def target = new File(figmaGeneratedRes.get().asFile, 'drawable-nodpi/brand_logo.png')
        target.parentFile.mkdirs()
        target.bytes = bytes
    }
}
tasks.matching { it.name == 'preBuild' || (it.name.startsWith('merge') && it.name.endsWith('Resources')) }.configureEach {
    dependsOn prepareBrandAssetsTask
}
