name: Build Ghadir Partner Android 5.4.3.3 Figma R2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build customer portal only
        run: gradle --no-daemon --console=plain :app:assemblePortalDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-5.4.3.3-Figma-R2-Debug
          path: app/build/outputs/apk/portal/debug/*.apk
          if-no-files-found: error
