name: Build Ghadir Partner Android 5.4.3.3 Figma R3
on:
  push:
    branches: [codex/android-figma-r3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build customer portal only
        run: gradle --no-daemon --console=plain :app:assemblePortalDebug :app:lintPortalDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-5.4.3.3-Figma-R3-Debug
          path: app/build/outputs/apk/portal/debug/*.apk
          if-no-files-found: error
