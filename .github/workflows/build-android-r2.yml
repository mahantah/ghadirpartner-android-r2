name: Build exact Ghadir Partner r5.42 source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  portal:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [29]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '7c974c06ff13072026470964d4133b09f9ed5904'
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ghadir-portal-r4-debug-signing-v1
      - name: Build and lint portal and automation apps
        run: gradle --no-daemon --console=plain :app:testPortalDebugUnitTest :app:assemblePortalDebug :app:assemblePortalDebugAndroidTest :app:lintPortalDebug :app:assembleAutomationDebug :app:lintAutomationDebug
      - name: Enable emulator acceleration
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Verify cold start and resume on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash validation/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-UI-Update-Debug-APK-API${{ matrix.api }}
          path: app/build/outputs/apk/portal/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GhadirAutomation-UI-Update-Debug-APK-API${{ matrix.api }}
          path: app/build/outputs/apk/automation/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-Build-Reports-API${{ matrix.api }}
          path: app/build/reports/
