name: Build Ghadir Partner Android R5.12
on:
  push:
    branches: [main, codex/compact-r5, codex/integrate-r54, codex/figma-100-573, codex/r56-login-security, feature/customer-order-review]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ghadir-portal-r4-debug-signing-v1
      - name: Build and lint portal and automation apps
        run: gradle --no-daemon --console=plain :app:testPortalDebugUnitTest :app:assemblePortalDebug :app:assemblePortalDebugAndroidTest :app:lintPortalDebug :app:assembleAutomationDebug :app:lintAutomationDebug
      - name: Build signed updates when the existing release secrets are configured
        id: release
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo '::notice::Release signing secret references are incomplete; debug artifacts only.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ghadir-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['ANDROID_KEYSTORE_FILE'])
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PYKEY
          gradle --no-daemon --console=plain :app:assemblePortalRelease :app:bundlePortalRelease :app:assembleAutomationRelease :app:bundleAutomationRelease
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for flavor in portal automation; do
            if [[ "$flavor" == portal ]]; then
              previous=GhadirPartner-5.4.3.3-r5.11-portal-release.apk
            else
              previous=GhadirAutomation-5.4.3.3-r5.11-release.apk
            fi
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/mahantah/curser/d751ed866014c3b300c673a41751637826e53efb/download/android/5.4.3.3-r5.11/$previous" -o "$RUNNER_TEMP/$previous"
            "$signer" verify --print-certs "$RUNNER_TEMP/$previous" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' > "$RUNNER_TEMP/old-cert"
            "$signer" verify --print-certs "app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' > "$RUNNER_TEMP/new-cert"
            test -s "$RUNNER_TEMP/old-cert"
            cmp "$RUNNER_TEMP/old-cert" "$RUNNER_TEMP/new-cert"
          done
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.signed == 'true'
        with:
          name: GhadirPartner-R5.12-Signed-Updates
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/bundle/*Release/*.aab
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Verify cold start and resume on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash validation/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-5.4.3.3-R5.12-Debug-APK
          path: app/build/outputs/apk/portal/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GhadirAutomation-5.4.3.3-R5.12-Debug-APK
          path: app/build/outputs/apk/automation/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R5-Build-Reports
          path: app/build/reports/
