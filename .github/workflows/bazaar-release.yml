name: Prepare and submit Cafe Bazaar APK
on:
  push:
    branches: [release/bazaar-5.55]
permissions:
  contents: read
concurrency:
  group: bazaar-ghadir-partner
  cancel-in-progress: false
jobs:
  signing-readiness:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.readiness.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that the existing signing secrets are configured
        id: readiness
        env:
          GHADIR_RELEASE_KEYSTORE_BASE64: ${{ secrets.GHADIR_RELEASE_KEYSTORE_BASE64 }}
          GHADIR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GHADIR_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$GHADIR_RELEASE_KEYSTORE_BASE64" || -z "$GHADIR_RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Existing Android release signing secrets are missing"
            exit 1
          fi
          if grep -qx 'version_code: 543111' config/order-flow.yaml; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: signing-readiness
    if: needs.signing-readiness.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Check publication tooling
        run: |
          python -m pip install -r release_tools/requirements-dev.txt
          bash validation/check-release-tools.sh
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build and lint release
        run: gradle --no-daemon --console=plain :app:testPortalDebugUnitTest :app:assemblePortalRelease :app:lintPortalRelease
      - name: Sign with the existing app certificate
        env:
          GHADIR_RELEASE_KEYSTORE_BASE64: ${{ secrets.GHADIR_RELEASE_KEYSTORE_BASE64 }}
          GHADIR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GHADIR_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          python -m release_tools.sign --input app/build/outputs/apk/portal/release/app-portal-release-unsigned.apk --output release-output/GhadirPartner-release.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 release-output/GhadirPartner-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Signed-Bazaar-APK
          path: release-output/*.apk
          if-no-files-found: error
